<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect</title>
    <meta name="description" content="Gérez les réservations de sièges de la ligne interurbaine BusDirect Safi → Marrakech : plan de la cabine, réservation, modification et annulation.">
     <!-- Tailwind CSS-->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800">
<header class="site-header sticky top-0 z-10 bg-white border-b border-slate-200 px-4 py-3 flex flex-wrap items-center justify-between gap-2">
    <a href="index.html" class="flex items-center gap-2 font-extrabold text-xl">
      <img src="img/Logo BusDirect.png" alt="BusDirect" width="40" height="40" class="h-10 w-auto md:h-12">
      <span>Bus<span class="text-blue-600">Direct</span></span>
    </a>

    <button id="menuBtn" aria-expanded="false" aria-controls="mainNav" aria-label="Ouvrir le menu"
      class="md:hidden w-10 h-10 rounded-lg bg-blue-50 text-blue-600 text-xl">☰</button>

    <nav id="mainNav" aria-label="Navigation principale"
      class="hidden w-full flex-col gap-1 md:flex md:w-auto md:flex-row">
      <a href="index.html" aria-current="page" class="px-3 py-2 rounded-lg font-semibold bg-blue-50 text-blue-600">Réservations</a>
      <a href="tickets.html" class="px-3 py-2 rounded-lg font-semibold">Tickets</a>
    </nav>
</header>
<main class="max-w-6xl mx-auto p-4 grid gap-4 lg:grid-cols-2 lg:items-start">
    <!-- carte du trajet-->
  <section class="bg-white rounded-2xl shadow px-4 py-3 lg:col-span-2 flex flex-wrap items-center gap-3" aria-labelledby="tripTitle">
  <!-- logo + titre puis prix -->
    <div class="flex flex-wrap items-center gap-3">
    <!-- Logo + titre  sur meme ligne -->
      <div class="flex items-center gap-3">
        <span class="w-12 h-12 shrink-0 grid place-items-center rounded-xl bg-blue-50">
          <img src="img/Logo BusDirect.png" alt="BusDirect" class="w-8 h-8 object-contain">
        </span>
        <h1 id="tripTitle" class="text-lg md:text-xl font-extrabold text-slate-900">Safi → Marrakech</h1>
      </div>
    <!-- Prix  -->
      <p class="px-3 py-1 rounded-lg bg-blue-50 text-blue-600 text-sm font-bold">80 DH / place</p>
    </div>
  <!-- Légende -->
    <ul class="flex gap-4 p-2 pr-4 rounded-full bg-slate-50 border border-slate-200 text-sm text-slate-500 md:ml-auto" aria-label="Légende des états">
      <li class="flex items-center gap-2">
        <span class="w-7 h-7 grid place-items-center rounded-lg bg-green-50 border border-green-300 text-green-700" aria-hidden="true">✓</span>
        Libre
      </li>
      <li class="flex items-center gap-2">
       <span class="w-7 h-7 grid place-items-center rounded-lg bg-red-50 border border-red-300 text-red-700" aria-hidden="true">●</span>
        Occupé
      </li>
    </ul>
</section>
<div id="seats" class="grid grid-cols-4 gap-2 md:gap-3">
  <!-- Ligne 1 -->
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">1<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">2<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm ml-3">3<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">4<br></button>

  <!-- Ligne 2 -->
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">5<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">6<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm ml-3">7<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">8<br></button>

  <!-- Ligne 3 -->
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">9<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">10<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm ml-3">11<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">12<br></button>

  <!-- Ligne 4 -->
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">13<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">14<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm ml-3">15<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">16<br></button>

  <!-- Ligne 5 -->
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">17<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">18<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm ml-3">19<br></button>
  <button class="h-16 md:h-20 rounded-lg border border-green-300 bg-green-50 text-green-700 text-sm">20<br></button>
</div>

  </main> 
  <footer class="site-footer bg-blue-50 border-t border-slate-200 mt-8 px-4 py-6">
      <p class="text-center text-sm text-slate-500">
          © 2026 <strong class="text-blue-600">BusDirect</strong>. Tous droits réservés.
      </p>
  </footer> 
</body>
</html>
