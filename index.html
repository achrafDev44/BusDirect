<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect</title>
    <script src ="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
    <header class="bg-slate-900 px-6 py-6 text-white">
        <div class="mx-auto max-w-6xl">
            <h1 class="text-3xl font-bold">BusDirect</h1>
            <p2 class="mt-2 text-slate-300">Safi -> Marrakech</p2>
        </div>
    </header>
<!-- hada bach li carte yjiwena mekadinine fi espace  -->
    <main class="mx-auto max-w-6xl space-y-6 p-6"> 
 <!-- hada bach espace mabine article o  article  -->
        <section class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3"> 
            <article class="rounded-xl bg-white p-5 shadow-sm">
                <p class="text-sm text-slate-500">Places disponibles</p>
                <p id="places-disponible" class="mt-2 text-3xl font-bold">20/20</p>
            </article>

            <article class="rounded-xl bg-white p-5 shadow-sm">
                <p class="text-sm text-slate-500">Prix total</p>
                <p id="prix-total" class="mt-2 text-3xl font-bold">0 DH</p>
             </article>
        </section>
    </main>
    <!-- Formulaire de reservations  -->
     <section class="rounded-xl bg-white p-6 shadow-sm">
        <h2 class="mb-4 text-xl font-bold">Réservation un siége</h2>

        <form id ="form-reservation" class="space-y-4">
            <div>
                <label for="nom-passager" class="mb-1 block font-medium"> Nom du passager</label>
                <input type="text" id="nom-passager" placeholder="Entrer Votre nom" class="w-full rounded-lg border-slate-300 p-3" required>
            </div>
            <div>
                <label for="numero-siege" class="mb-1 block font-medium"> Choisir un siège</label>
                <select id="numero-siege" class="w-full rounded-lg border border-slate-300 p-3 required">
                    <option value="">Choisir un siège</option>
                </select>
            </div>
            <button type="submit" class="rounded-lg bg-blue-600 px-5 py-3 font-bold text-white">Réserver
            </button>
            <p id="message-reservation" class="font-medium"></p>

        </form>

     </section>
    <section class="rounded-xl bg-white p-6 shadow-sm">
        <h2 class="mb-2 text-xl font-bold">Plan de la cabine</h2>
        <div class="mb-5 flex flex-wrap gap-4 text-sm">
            <p class="flex items-center gap-2">
                <span class="h-4 w-4 rounded bg-green-500"></span>
                Libre
            </p>
            <p class="flex item-centre gap-2">
                <span class="h-4 w-4 rounded bg-red-500"></span>
                Occupé
            </p>
        </div>
        <div id="plan-bus" class="grid grid-cols-2 gap-4 sm:grid-colos-4"> 
        </div>
    </section> 
    
   <!-- Formulaire de modification -->
    <section class="rounded-xl bg-white p-6 shadow-sm ">
        <h2 class="mb-4 text-xl font-bold">Modifier une reservation </h2>
        <form id="form-modification" class="mb-1 block font-medium">
            <div>
                <label for="reservation-a-modifier" class="mb-1 block font-medium"> Choisir la reservation pour modifier</label>
                <select id="reservation-a-modifier" class="w-full rounded-lg border border-slate-300 p-3" required>
                    <option value="">Choisir une réservation</option>
                </select>
            </div>
            <div>
                <label for="nom-modification" class="mb-1 block font-medium"> Nouveau nom du passager</label>
                <input type="text" id="nom-modification" placeholder="Entrer le nouveau nom" class="w-full rounded-lg border border-slate-300 p-3" required>
            </div>
            <div>
                <label for="siege-modification" class="mb-1 block font-medium"> Nouveau siege</label>
                <select id="siege-modification" class="w-full rounded-lg border border-slate-300 p-3" required>
                    <option value="">Choisir un siege</option>
                </select>
            </div>
            <button type="=submit" class="rounded-lg bg-blue-600 px-5 py-5 m-2 font-bold text-white">Modifier </button>
        </form>
    </section>
    <!-- Formulaire de supprimer -->
     <section class="rounded-xl bg-white p-6 shadow-sm">
        <h2 class="mb-4 text-xl font-bold">Supprimer une reservatio</h2>
        <form id="form-suppression" class="space-y-4">
            <div>
                <label for="siege-suppression" class="mb-1 block font-medium">Choisir le siege à supprimer</label>
                <select id="siege-supprimer" class="w-full rounded-lg border border-slate-300 p-3" required>
                    <option value="">Choisir un siege</option>
                </select>
            </div>
            <button type="submit" class="rounded-lg bg-blue-600 px-5 py-5 font-bold text-white">Supprimer </button>
            <p id="message-suppression" class="font-medium"></p>

        </form>
     </section>
 <script src="script.js"></script>   
</body>
</html>
